name: Build & Release APK

# Push a version tag (e.g. v1.0.0) → GitHub builds the signed APK and publishes
# a Release with it attached. Or run manually from the Actions tab to just get
# the APK as a build artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # gradle.properties pins a local macOS JDK path; drop it so the build
      # uses the runner's JDK 17 (exposed via JAVA_HOME by setup-java).
      - name: Use the runner's JDK
        run: sed -i '/org\.gradle\.java\.home/d' gradle.properties

      # The signing keystore is gitignored, so restore it from repo secrets.
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/doughminder-release.jks
          {
            echo "storeFile=doughminder-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Build signed release APK
        run: ./gradlew assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk doughminder.apk

      # Manual runs get the APK here (Actions run → Artifacts).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: doughminder-apk
          path: doughminder.apk

      # Tag pushes also get a public Release with the APK attached.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: doughminder.apk
          name: Doughminder ${{ github.ref_name }}
          generate_release_notes: true
